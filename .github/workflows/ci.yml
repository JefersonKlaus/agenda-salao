name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q backend/tests

  frontend:
    name: Frontend (sintaxe e navegador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Conferir a sintaxe dos módulos JS
        run: |
          mkdir -p "$RUNNER_TEMP/js"
          for f in frontend/js/*.js frontend/js/telas/*.js; do
            cp "$f" "$RUNNER_TEMP/js/$(echo "$f" | tr / _).mjs"
            node --check "$RUNNER_TEMP/js/$(echo "$f" | tr / _).mjs"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Teste de ponta a ponta (Chromium + API local em memória)
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python e2e/teste_e2e.py

  infra:
    name: Terraform (formato e validação)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
