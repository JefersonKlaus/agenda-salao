# Production does NOT deploy by itself: someone presses the "Run workflow" button (Actions tab) on the main branch.
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "producao" to confirm'
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Check branch and confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Only main, only with confirmation
        env:
          REF: ${{ github.ref }}
          CONFIRM: ${{ inputs.confirm }} # through a variable: typed text is never pasted into the shell
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Production only deploys from the main branch (ran on $REF)."
            exit 1
          fi
          if [ "$CONFIRM" != "producao" ]; then
            echo '::error::Wrong confirmation: type exactly "producao".'
            exit 1
          fi

  tests:
    needs: guard
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: tests
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: prod
      github_environment: producao
