# Produção NÃO publica sozinha: alguém aperta o botão "Run workflow" (aba Actions) na branch main.
name: Deploy produção

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite "producao" para confirmar'
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  guarda:
    name: Conferir branch e confirmação
    runs-on: ubuntu-latest
    steps:
      - name: Só a main, só com confirmação
        env:
          REF: ${{ github.ref }}
          CONFIRMAR: ${{ inputs.confirmar }} # por variável: texto digitado nunca é colado no shell
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Produção só publica a partir da branch main (rodou em $REF)."
            exit 1
          fi
          if [ "$CONFIRMAR" != "producao" ]; then
            echo '::error::Confirmação incorreta: digite exatamente "producao".'
            exit 1
          fi

  testes:
    needs: guarda
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: testes
    uses: ./.github/workflows/deploy-reutilizavel.yml
    with:
      ambiente: prod
      ambiente_github: producao
