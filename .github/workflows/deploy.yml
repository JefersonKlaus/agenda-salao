name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dois deploys nunca rodam ao mesmo tempo (o Terraform trava o estado de qualquer jeito).
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testes:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Publicar na AWS
    needs: testes
    runs-on: ubuntu-latest
    environment: producao # configure "Required reviewers" neste ambiente para exigir aprovação
    permissions:
      id-token: write # necessário para entrar na AWS por OIDC, sem chave guardada
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false # senão `terraform output -raw` vem com texto extra

      - name: Terraform init e apply
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=agenda-salao/prod.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
          terraform apply -auto-approve -input=false \
            -var="regiao=${{ vars.AWS_REGION }}" \
            -var="repositorio_github=${{ github.repository }}" \
            -var="bucket_estado=${{ vars.TF_STATE_BUCKET }}" \
            -var="criar_provedor_oidc=${{ vars.CRIAR_PROVEDOR_OIDC || 'true' }}"

      - name: Gerar frontend/js/config.js com os dados da AWS
        working-directory: infra
        run: |
          printf 'export const CONFIG = { regiao: "%s", clienteId: "%s", apiUrl: "%s" };\n' \
            "$AWS_REGION" \
            "$(terraform output -raw cognito_client_id)" \
            "$(terraform output -raw api_url)" > ../frontend/js/config.js
          cat ../frontend/js/config.js

      - name: Publicar o site e limpar o cache
        working-directory: infra
        run: |
          aws s3 sync ../frontend "s3://$(terraform output -raw bucket_do_site)" \
            --delete --cache-control "no-cache"
          aws cloudfront create-invalidation \
            --distribution-id "$(terraform output -raw cloudfront_id)" --paths "/*" > /dev/null
          echo "Site: $(terraform output -raw url_do_site)" >> "$GITHUB_STEP_SUMMARY"
