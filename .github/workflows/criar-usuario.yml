# Cria o login de um salão no Cognito, sem terminal: Actions → Criar usuário do salão → Run workflow.
name: Criar usuário do salão

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Em qual ambiente criar o usuário"
        required: true
        type: choice
        options: [dev, producao]
      email:
        description: "E-mail do salão (recebe a senha temporária)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  criar:
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente }}
    env:
      EMAIL: ${{ inputs.email }} # por variável: texto digitado nunca é colado no shell
      AMBIENTE: ${{ inputs.ambiente }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Criar o usuário
        run: |
          if ! printf '%s' "$EMAIL" | grep -Eq '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'; then
            echo "::error::E-mail inválido."
            exit 1
          fi
          NOME_TF="dev"
          [ "$AMBIENTE" = "producao" ] && NOME_TF="prod"
          POOL="$(aws cognito-idp list-user-pools --max-results 60 \
            --query "UserPools[?Name=='agenda-salao-${NOME_TF}-usuarios'].Id | [0]" --output text)"
          if [ -z "$POOL" ] || [ "$POOL" = "None" ]; then
            echo "::error::Não achei o Cognito deste ambiente. Publique o ambiente primeiro."
            exit 1
          fi
          aws cognito-idp admin-create-user --user-pool-id "$POOL" --username "$EMAIL" \
            --user-attributes Name=email,Value="$EMAIL" Name=email_verified,Value=true > /dev/null
          echo "Usuário $EMAIL criado em **$AMBIENTE**. Ele recebe a senha temporária por e-mail." >> "$GITHUB_STEP_SUMMARY"
